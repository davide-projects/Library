<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Membri</title>

    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

    <!-- Protezione pagina -->
    <script src="/js/auth.js"></script>
    <script src="/js/logout.js"></script>
</head>

<body class="bg-light">

<!-- NAVBAR -->
<div id="navbar-placeholder"></div>
<script>
    $("#navbar-placeholder").load("/components/navbar.html");
</script>

<!-- GLOBAL MODAL -->
<div id="modal-placeholder"></div>
<script>
    $("#modal-placeholder").load("/components/modal.html");
</script>

<div class="container py-4">

    <h1 class="mb-4">👤 Membri</h1>

    <!-- TABLE -->
    <table class="table table-striped" id="membersTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Città</th>
            <th>Telefono</th>
            <th>Azioni</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <hr>

    <!-- ADD MEMBER FORM -->
    <h3>Aggiungi Membro</h3>

    <form id="addMemberForm">
        <div class="row">
            <div class="col-md-3">
                <input class="form-control" placeholder="Nome" id="firstName">
            </div>
            <div class="col-md-3">
                <input class="form-control" placeholder="Cognome" id="lastName">
            </div>
            <div class="col-md-3">
                <input class="form-control" placeholder="Città" id="city">
            </div>
            <div class="col-md-3">
                <input class="form-control" placeholder="Telefono" id="phone">
            </div>
        </div>

        <button class="btn btn-primary mt-3" type="submit">Aggiungi</button>
    </form>

</div>

<script src="/js/modal.js"></script>
<script src="/js/members.js"></script>

</body>
</html>
